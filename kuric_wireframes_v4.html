<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KURIC Web Portal — UI Screens</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --ink:#14181D; --muted:#55524A; --body:#3A382F;
  --teal:#0E6E5C; --teal-dark:#0B5A4A; --teal-tint:#DCEEE9; --teal-tint-b:#A7D6CB;
  --gold:#C89B3C; --gold-dark:#8A5F17; --gold-tint:#F7EACB; --gold-tint-b:#E9CD86;
  --danger:#B24B36; --danger-dark:#96311F; --danger-tint:#F7DDD6; --danger-tint-b:#E6B4A4;
  --border:#DDD7C8; --border-strong:#C9C2AE;
  --bg:#FAF8F3; --surface:#FFFFFF; --chrome:#F0EEE6;
  --sidebar-w:270px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#EFEBE0;font-family:'Inter',sans-serif;color:var(--ink);}
.app{display:flex;min-height:100vh;}

.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);padding:22px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:0 20px 18px;margin-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--teal);flex:0 0 auto;}
.brand h1{font-family:'Fraunces',serif;font-size:16px;font-weight:700;margin:0;color:var(--ink);}
.brand p{font-size:11px;color:var(--muted);margin:2px 0 0;font-weight:500;}

.role-group{margin-top:16px;}
.role-head{padding:0 20px;margin-bottom:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.screen-btn{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:8px 20px 8px 20px;font-size:12.8px;color:var(--body);font-weight:500;border-left:3px solid transparent;font-family:'Inter',sans-serif;}
.screen-btn .num{font-size:11px;color:var(--muted);flex:0 0 16px;font-weight:600;}
.screen-btn:hover{background:var(--teal-tint);}
.screen-btn.active{background:var(--teal-tint);border-left:3px solid var(--teal);font-weight:700;color:var(--teal-dark);}

.main{flex:1;padding:32px 40px 60px;min-width:0;}
.topbar{margin-bottom:16px;}
.crumb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}
.stitle{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--ink);}
.note{max-width:860px;margin:16px auto 0;font-size:12.5px;color:var(--body);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;}
.note b{color:var(--ink);}

.frm{font-family:'Inter',sans-serif;width:100%;max-width:860px;margin:0 auto;border:1px solid var(--border-strong);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:0 4px 16px rgba(20,24,29,0.08);}
.chr{height:34px;background:var(--chrome);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 12px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);}
.url{margin-left:8px;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:5px;padding:2px 10px;}
.cnt{height:520px;overflow-y:auto;background:var(--bg);}

.cnt input,.cnt textarea,.cnt select{font-family:'Inter',sans-serif;}
@media (max-width:980px){
  .sidebar{position:relative;height:auto;width:100%;flex:none;}
  .app{flex-direction:column;}
  .main{padding:20px 14px 50px;}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="topbar">
      <div class="crumb" id="crumb">PUBLIC WEBSITE</div>
      <div class="stitle" id="stitle">Home Page</div>
    </div>
    <div class="frm">
      <div class="chr"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url" id="urlbar">kuric.ku.ac.bd/</span></div>
      <div class="cnt" id="cnt"></div>
    </div>
    <div class="note" id="note"></div>
  </main>
</div>

<script>
const screens = [];
function add(o){ screens.push(o); }
const navTop = `<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:#fff;">
<div style="display:flex;align-items:center;gap:10px;"><div style="width:28px;height:28px;border-radius:7px;background:var(--teal);"></div><span style="font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--ink);">KURIC</span></div>
<div style="display:flex;gap:22px;font-size:13px;color:var(--body);font-weight:500;"><span>Home</span><span>About</span><span>Research</span><span>Publications</span><span>Events</span><span>Contact</span></div>
<button style="background:var(--teal);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-size:12.5px;font-weight:600;">Submit proposal</button>
</div>`;
function navSimple(){
  return `<div style="display:flex;align-items:center;gap:10px;padding:16px 28px;border-bottom:1px solid var(--border);background:#fff;"><div style="width:26px;height:26px;border-radius:6px;background:var(--teal);"></div><span style="font-family:'Fraunces',serif;font-weight:700;font-size:15px;">KURIC</span></div>`;
}
function sidenav(items, activeIdx){
  return `<div style="width:160px;background:#fff;border-right:1px solid var(--border);padding:20px 0;flex-shrink:0;">
  <div style="padding:0 18px 16px;"><div style="width:26px;height:26px;border-radius:6px;background:var(--teal);"></div></div>
  ${items.map((t,i)=>`<div style="padding:9px 18px;font-size:12.5px;${i===activeIdx?'background:var(--teal-tint);border-left:3px solid var(--teal);color:var(--teal-dark);font-weight:700;':'color:var(--body);font-weight:500;'}">${t}</div>`).join('')}
  </div>`;
}

/* ---------------- PUBLIC ---------------- */

/* ============ APP ============ */
const sidebarEl = document.getElementById('sidebar');
const roles = [];
screens.forEach(s=>{ if(!roles.includes(s.role)) roles.push(s.role); });

function buildSidebar(){
  let html = `<div class="brand"><div class="mark"></div><div><h1>KURIC Web Portal</h1><p>23 UI Screens · v4</p></div></div>`;
  let gi = 0;
  roles.forEach(role=>{
    html += `<div class="role-group"><div class="role-head">${role}</div>`;
    screens.forEach((s,i)=>{ if(s.role===role){ gi++; html += `<button class="screen-btn" data-i="${i}"><span class="num">${String(gi).padStart(2,'0')}</span><span>${s.title}</span></button>`; } });
    html += `</div>`;
  });
  sidebarEl.innerHTML = html;
  sidebarEl.querySelectorAll('.screen-btn').forEach(btn=> btn.addEventListener('click', ()=> selectScreen(parseInt(btn.dataset.i))));
}
function selectScreen(i){
  const s = screens[i];
  document.getElementById('crumb').textContent = s.crumb;
  document.getElementById('stitle').textContent = s.title;
  document.getElementById('urlbar').textContent = s.url;
  document.getElementById('cnt').innerHTML = s.render();
  document.getElementById('note').innerHTML = `<b>Why this layout:</b> ${s.note}`;
  sidebarEl.querySelectorAll('.screen-btn').forEach(b=> b.classList.toggle('active', parseInt(b.dataset.i)===i));
}
buildSidebar();
selectScreen(0);
</script>
